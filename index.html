<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Agent Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* Layout: satu bingkai aplikasi gelap. Kiri kanvas kantor isometrik, kanan panel chat #office-general; di HP ditumpuk. */
:root{
  color-scheme:dark;
  --bg:#0a0a0f;
  --frame:#0e0f14;
  --panel:#14161c;
  --panel-2:#1a1d25;
  --line:#252935;
  --text:#dde1ea;
  --text-2:#c4c9d8;
  --muted:#7c8294;
  --dim:#5c6272;
  --ok:#34d27b;
  --boss:#f0554a;
  --claude:#e4895f;
  --nova:#9a86f5;
  --bolt:#45bdd0;
  --pixel:'Silkscreen','Courier New',monospace;
  --ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--ui)}
.wrap{height:100%;padding-inline:16px;padding-block:12px}
.app{height:100%;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--frame)}

.bar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:#0b0c10;font-family:var(--pixel);font-size:10px;letter-spacing:.28em;color:#5d6374;text-transform:uppercase}
.bar .live{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.bar .brand{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--pixel);font-size:9px;letter-spacing:.16em;border:1px solid var(--line);background:#14161c;color:var(--muted);padding:4px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{color:var(--text);border-color:#343947}
.chip i{width:7px;height:7px;border-radius:50%;background:#f4b26a;display:block}

.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 340px}
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(120% 90% at 50% 40%,#171a26 0%,#0c0d13 70%)}
#cv{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.zoom{position:absolute;left:10px;top:8px;z-index:2;display:flex;gap:6px}
.zoom .chip{min-width:30px;justify-content:center}
.roster{position:absolute;left:10px;right:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.rc{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 8px;border-radius:999px;background:rgba(10,11,15,.78);border:1px solid var(--line);font-size:11px;color:var(--text-2);white-space:nowrap}
.rc b{font-weight:600}
.rc em{font-style:normal;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.rc i{flex:none;width:7px;height:7px;border-radius:2px}
.tip{position:absolute;z-index:3;min-width:150px;max-width:220px;padding:8px 10px;border-radius:8px;background:#171a22;border:1px solid #303544;box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:12px;pointer-events:none}
.tip b{display:block;font-size:13px}
.tip span{color:var(--muted)}

.chat{display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--line);background:var(--panel)}
.chead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px}
.chead .ch{font-weight:600;display:flex;gap:6px;align-items:baseline;min-width:0}
.chead .ch s{text-decoration:none;color:var(--dim)}
.chead .sp{flex:1}
.online{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.online i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.sw{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--ok);font-family:var(--pixel);font-size:9px;letter-spacing:.1em;cursor:pointer}
.sw .tr{width:30px;height:16px;border-radius:999px;background:#2a2e3a;position:relative;transition:background .15s}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#e7eaf1;transition:transform .15s}
.sw[aria-checked="true"] .tr{background:var(--ok)}
.sw[aria-checked="true"] .tr::after{transform:translateX(14px)}
.sw[aria-checked="false"]{color:var(--muted)}
.snd{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.snd button{background:none;border:0;padding:2px;color:inherit;cursor:pointer;display:flex}
.snd button[aria-pressed="true"]{color:#e0615a}
.snd input{width:56px;accent-color:var(--ok);margin:0}
button:focus-visible,input:focus-visible{outline:2px solid #6aa8ff;outline-offset:2px}

.msgs{flex:1;min-height:0;overflow-y:auto;padding:8px 0}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:6px 14px}
.msg:hover{background:rgba(255,255,255,.02)}
.av{width:32px;height:32px;border-radius:6px;image-rendering:pixelated;display:block}
.hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm{font-weight:600;font-size:13px}
.rl{font-family:var(--pixel);font-size:8px;letter-spacing:.1em;padding:1px 4px;border:1px solid currentColor;border-radius:3px;opacity:.75}
.tm{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.tx{color:var(--text-2);overflow-wrap:anywhere}
.tx.sy{color:var(--muted);display:flex;align-items:center;gap:6px}
.tx.sy::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--ok);flex:none}
.tx.hint{white-space:pre-line}
.composer{padding:10px 14px 12px;border-top:1px solid var(--line)}
.composer input{width:100%;background:#0f1116;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font:inherit;font-size:16px}
.composer input::placeholder{color:#555b6c}

.rooms{position:absolute;left:10px;top:8px;z-index:2;display:flex;gap:6px}
.rooms .chip{gap:8px}
.rooms .chip[aria-pressed="true"]{color:var(--text);border-color:#4a5066;background:#1f2330}
.rooms b{font-weight:400;color:var(--ok);font-variant-numeric:tabular-nums}
@media (max-width:820px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,50%) minmax(0,1fr)}
  .chat{border-left:0;border-top:1px solid var(--line)}
  .bar .brand{text-align:left;letter-spacing:.2em}
  .snd input{width:44px}
}
@media (max-width:420px){
  .bar{padding-inline:10px;gap:8px}
  .chead{padding-inline:10px;gap:8px}
  .snd input{display:none}
}
</style>

<div class="wrap">
 <div class="app">
  <header class="bar">
   <span class="live" aria-hidden="true"></span>
   <span class="brand">Agent Office</span>
   <button class="chip" id="adzanbtn" type="button" title="Pilih file audio adzan dari perangkat">ADZAN</button><input type="file" id="adzanfile" accept="audio/*" hidden><button class="chip" id="sholat" type="button" title="Demo waktu sholat">SHOLAT</button>
   <button class="chip" id="mode" type="button" aria-label="Mode waktu">AUTO</button>

  </header>

    <canvas id="cv" aria-label="Kantor isometrik dengan agen AI yang sedang bekerja"></canvas>
    <div class="zoom"><button class="chip" id="zout" type="button" aria-label="Perkecil">−</button><button class="chip" id="zfit" type="button" aria-label="Atur ulang zoom">125%</button><button class="chip" id="zin" type="button" aria-label="Perbesar">+</button></div>
    <div class="roster" id="roster"></div>

   </section>
   <aside class="chat">
    <div class="chead">
     <div class="ch"><s>#</s><span>office-general</span></div>
     <span class="online"><i></i><span id="online">0</span></span>
     <span class="sp"></span>
     <button class="sw" id="ai" type="button" role="switch" aria-checked="true"><span class="tr"></span><span id="ailabel">AI ON</span></button>
     <span class="snd">
      <button id="mute" type="button" aria-pressed="false" aria-label="Bisukan suara">
       <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z"/><path id="wave" d="M11 5.5a3.5 3.5 0 0 1 0 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <input id="vol" type="range" min="0" max="1" step="0.05" value="0.35" aria-label="Volume">
     </span>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <form class="composer" id="form" autocomplete="off">
     <input id="inp" type="text" maxlength="200" placeholder="Pesan #office-general" aria-label="Pesan">
    </form>
   </aside>
  </main>
 </div>
</div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const stage=$('#stage');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const N=10, NY=20, NE=16, NW=22, TW=64, TH=32, WH=150;
let S=1,OX=0,OY=0,CW=0,CH=0,DPR=1,LAY=[[0,0],[0,0]],meetTxt='';
const rnd=()=>Math.random(), pick=a=>a[Math.floor(rnd()*a.length)];
function hs(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pickR=(arr,r)=>arr[Math.floor(r()*arr.length)];
let DX=0,DY=0;
const P=(x,y,z=0)=>[OX+(x+DX-y-DY)*TW/2*S, OY+(x+DX+y+DY)*TH/2*S - z*S];
function addS(dx,dy,k,f){add(k+dx+dy,t=>{DX=dx;DY=dy;f(t);DX=DY=0;});}

/* ---------- warna ---------- */
function rgb(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(a=>a+a).join('');return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];}
function sh(c,f){const [r,g,b]=rgb(c);const k=v=>Math.max(0,Math.min(255,Math.round(v*f)));return `rgb(${k(r)},${k(g)},${k(b)})`;}
function poly(pts,fill,stroke){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
function box(x,y,z,w,d,h,top,left,right){
  poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)],top);
  poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)],left);
  poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)],right);
}
const bx=(x,y,z,w,d,h,c)=>box(x,y,z,w,d,h,sh(c,1.12),sh(c,.86),sh(c,.64));

/* ---------- waktu ---------- */
const PH={
 dawn:{label:'DAWN IS BREAKING',dot:'#f4b26a',top:'#e8a0a8',bot:'#ffd9a8',bld:'#6a7aa8',bld2:'#8590b8',glow:'rgba(255,196,150,.16)',over:'rgba(46,30,76,.16)',lights:.15,cloud:.7},
 day:{label:'FULL DAYLIGHT',dot:'#ffe27a',top:'#6fb8ee',bot:'#d9f0ff',bld:'#86a6c4',bld2:'#a9c3d9',glow:'rgba(255,240,190,.2)',over:'rgba(0,0,0,0)',lights:0,cloud:.9},
 dusk:{label:'GOLDEN HOUR',dot:'#ff9a4d',top:'#5a4fa6',bot:'#ffad66',bld:'#37345f',bld2:'#4d4a7a',glow:'rgba(255,170,96,.17)',over:'rgba(60,20,52,.2)',lights:.6,cloud:.35},
 night:{label:'NIGHT SHIFT',dot:'#7c8cff',top:'#0a1030',bot:'#2b3668',bld:'#141a38',bld2:'#1d2548',glow:'rgba(120,150,255,.07)',over:'rgba(6,8,38,.4)',lights:1,cloud:0}
};
let mode='auto',room='work';
function curPhase(){
  if(mode!=='auto')return PH[mode];
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  if(h>=4.5&&h<6.5)return PH.dawn;
  if(h>=6.5&&h<17)return PH.day;
  if(h>=17&&h<19)return PH.dusk;
  return PH.night;
}

/* ---------- data agen ---------- */
const AG=[
 {id:'boss',name:'CEO',role:'Pendiri',color:'#f0554a',hair:'#2b1d17',skin:'#e0ac86',shirt:'#c93a31',crown:true,human:true,desk:2,bg:'#4a1b1b',work:['Membaca laporan','Rapat singkat','Meninjau rencana']},
 {id:'claude',name:'Claude',role:'Engineer',color:'#e4895f',hair:'#5a3a26',skin:'#e8b793',shirt:'#d27a4f',desk:0,bg:'#4a2c1d',work:['Menulis kode','Refactor modul','Membaca log','Review PR']},
 {id:'nova',name:'Nova',role:'Desainer',color:'#9a86f5',hair:'#6a4fc7',skin:'#f0c6a3',shirt:'#7f6be0',desk:1,bg:'#2d2552',work:['Mendesain komponen','Memilih warna','Menyusun layout']},
 {id:'bolt',name:'Bolt',role:'QA',color:'#45bdd0',hair:'#1f3a44',skin:'#c99874',shirt:'#2f9db3',desk:3,bg:'#17353d',work:['Menjalankan tes','Mencari bug','Cek regresi']}
];
const AIS=AG.filter(a=>!a.human);
AG.forEach(a=>{a.g=a.id==='nova'?'f':'m';});
const MSEAT={boss:[5.3,13.1],bolt:[3.8,13.1],claude:[3.8,16.5],nova:[6.8,16.5]};
const MT=['Sprint planning','Review desain','Retrospektif','Demo fitur','Sinkronisasi harian'];
const MLN=['Prioritaskan fitur login dulu.','Estimasinya dua hari.','Ada risiko di API pembayaran.','Desainnya siap ditinjau.','Setuju, kita lanjut.','Tes regresi masih berjalan.','Ada pertanyaan?'];
function meetPlan(b){
  const r=mb(hs('meet:'+b));
  if(r()<.15)return null;
  const t0=160+r()*140,t1=t0+130+r()*70,topic=pickR(MT,r);
  const ids=AG.filter(a=>r()<(a.human?.75:.7)).map(a=>a.id);
  return ids.length<2?null:{t0,t1,topic,ids};
}
const byId=id=>AG.find(a=>a.id===id);

const DESKS=[
 {x:2,y:1.9,w:2.6,d:1.3,mons:3},
 {x:2,y:5.2,w:2.6,d:1.3,mons:2},
 {x:12.2,y:2.6,w:2.6,d:1.3,mons:3},
 {x:6.2,y:6.0,w:2.6,d:1.3,mons:2}
];
const SEATS=[[3.3,3.9],[3.3,7.2],[13.5,4.6],[7.5,8.0]];
const NODES={top:[5.3,1.6],a:[5.3,4.4],b:[5.3,8.0],cooler:[1.5,1.2],board:[3.8,1.5],printer:[5.95,1.4],door:[8.85,1.5],gate:[5.3,10],cg:[10,5],ci:[11.4,5],s0:SEATS[0],s1:SEATS[1],s2:SEATS[2],s3:SEATS[3]};
const EDGES=[['cooler','top'],['board','top'],['printer','top'],['door','top'],['top','a'],['a','b'],['s0','a'],['a','cg'],['cg','ci'],['ci','s2'],['s1','b'],['s3','b'],['b','gate']];
const ADJ={};
EDGES.forEach(([p,q])=>{(ADJ[p]=ADJ[p]||[]).push(q);(ADJ[q]=ADJ[q]||[]).push(p);});
function route(from,to){
  if(from===to)return [];
  const prev={[from]:null},qu=[from];
  while(qu.length){const c=qu.shift();if(c===to)break;for(const n of ADJ[c]){if(!(n in prev)){prev[n]=c;qu.push(n);}}}
  const out=[];let c=to;while(c&&c!==from){out.unshift(c);c=prev[c];}
  return out;
}
const SPOT={cooler:'Ngopi sebentar',printer:'Mencetak dokumen',board:'Mengecek papan tugas',door:'Menerima paket'};
AG.forEach((a,i)=>{
  const s=SEATS[a.desk];
  Object.assign(a,{x:s[0],y:s[1],state:'work',loc:'work',dest:null,bubble:null,auto:null,ph:i*1.7,act:a.work[0]});
});

/* ---------- tugas (dihitung dari jam dinding) ---------- */
const TS=50000;
const T_VERB=['Perbaiki','Rapikan','Tambah','Uji','Riset','Optimalkan','Tulis','Review'];
const T_NOUN=['login','dashboard','halaman harga','API pembayaran','form daftar','notifikasi','pencarian','laporan mingguan','cache','onboarding'];
let utasks=[];
function autoTask(j){
  const r=mb(hs('task:'+j));
  const created=j*TS+r()*15000,pickAt=created+40000+r()*80000,doneAt=pickAt+40000+r()*60000;
  const ow=AIS[Math.floor(r()*AIS.length)];
  return {id:'a'+j,text:pickR(T_VERB,r)+' '+pickR(T_NOUN,r),created,pickAt,doneAt,owner:ow.id};
}
function userTask(u){
  const r=mb(hs('ut:'+u.t+u.text));
  const pickAt=u.t+15000+r()*25000,ow=AIS[Math.floor(r()*AIS.length)];
  return {id:'u'+u.t,text:u.text,created:u.t,pickAt,doneAt:pickAt+40000+r()*40000,owner:ow.id};
}
function tasksBetween(t0,t1){
  const out=[],j0=Math.floor((t0-300000)/TS),j1=Math.floor(t1/TS);
  for(let j=j0;j<=j1;j++)out.push(autoTask(j));
  utasks.forEach(u=>out.push(userTask(u)));
  return out;
}
let tasks=[];
function refreshTasks(now){
  tasks=tasksBetween(now-600000,now)
    .filter(k=>k.created<=now&&k.doneAt>=now-600000)
    .sort((p,q)=>p.created-q.created)
    .map(k=>{const col=now>=k.doneAt?2:now>=k.pickAt?1:0;return {id:k.id,text:k.text,col,owner:col>=1?k.owner:null};});
}

/* ---------- gambar: ruangan ---------- */
const sky=[];
(function(){let u=0,s=7;const r=()=>{s=(s*9301+49297)%233280;return s/233280;};while(u<660){const w=12+r()*20,h=22+r()*58;sky.push({u,w,h,l:r(),win:r()});u+=w+2+r()*4;}})();
const PANES=[22,94,166,238,336];
const glows=[];

function wallT(left){const [e,f]=P(0,0,0);ctx.transform(left?-S:S,.5*S,0,-S,e,f);}

function drawFloor(ph){
  poly([P(0,NY,0),P(N,NY,0),P(N,NY,-14),P(0,NY,-14)],'#3a3f52');
  poly([P(N,18,0),P(N,NY,0),P(N,NY,-14),P(N,18,-14)],'#2a2e3d');
  poly([P(N,18,0),P(NW,18,0),P(NW,18,-14),P(N,18,-14)],'#3a3f52');
  poly([P(NW,0,0),P(NW,18,0),P(NW,18,-14),P(NW,0,-14)],'#2a2e3d');
  for(let i=0;i<N;i++){
    poly([P(i,0),P(i+1,0),P(i+1,10),P(i,10)],i%2?'#c79a69':'#d1a475');
    poly([P(i,10),P(i+1,10),P(i+1,NY),P(i,NY)],i%2?'#5b6682':'#66728f');
  }
  for(let i=N;i<NE;i++)poly([P(i,0),P(i+1,0),P(i+1,6),P(i,6)],i%2?'#7d5640':'#86604a');
  fl(10,6,16,12,'#9a6f4c','#a57a56');fl(10,12,16,18,'#2f5f4a','#356a52');fl(16,0,22,6,'#52406e','#5b4878');fl(16,6,22,12,'#3f6264','#477073');fl(16,12,22,18,'#1f4d3f','#1f4d3f');
  ctx.strokeStyle='rgba(40,20,10,.3)';ctx.lineWidth=1;
  for(let i=N;i<=NE;i++){const a=P(i,0),b=P(i,6);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}

  pts.forEach((p,i)=>{const q=WF(p[0],p[1]);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);});
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
}
function archPts(cx,hw,z0,zs,za){
  const L=[],c=zs+(za-zs)*.5;
  for(let i=0;i<=10;i++){const u=i/10;L.push([(1-u)*(1-u)*(cx-hw)+2*(1-u)*u*(cx-hw)+u*u*cx,(1-u)*(1-u)*zs+2*(1-u)*u*c+u*u*za]);}
  const R=L.slice(0,-1).reverse().map(p=>[2*cx-p[0],p[1]]);
  return [[cx-hw,z0],[cx-hw,zs]].concat(L,R,[[cx+hw,zs],[cx+hw,z0]]);
}
function domeAt(cx,cy,zb,r,hz,c1,c2){
  const C=P(cx,cy,zb),rx=32*Math.SQRT2*S*r,ry=16*Math.SQRT2*S*r,H=hz*S;
  const g=ctx.createLinearGradient(C[0]-rx,0,C[0]+rx,0);g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.beginPath();ctx.moveTo(C[0]+rx,C[1]);
  ctx.ellipse(C[0],C[1],rx,ry,0,0,Math.PI);
  ctx.ellipse(C[0],C[1],rx,H,0,Math.PI,2*Math.PI);
  ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=1;
  [-.66,-.33,0,.33,.66].forEach(u=>{ctx.beginPath();ctx.moveTo(C[0]+u*rx,C[1]+ry*Math.sqrt(1-u*u));ctx.quadraticCurveTo(C[0]+u*rx*1.1,C[1]-H*.8,C[0],C[1]-H);ctx.stroke();});
  ctx.strokeStyle=GOLD;ctx.lineWidth=Math.max(1.5,2*S);
  ctx.beginPath();ctx.ellipse(C[0],C[1],rx,ry,0,0,Math.PI);ctx.stroke();
  return [C[0],C[1]-H];
}
function finial(x,y){
  const h=8*S+3,r=Math.max(4,4.2*S+1.5);
  ctx.strokeStyle=GOLD;ctx.lineWidth=Math.max(1.5,1.6*S);
  ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-h);ctx.stroke();
  ctx.fillStyle=GOLD;ctx.beginPath();
  ctx.arc(x,y-h-r,r,0,2*Math.PI);
  ctx.arc(x+.3*r,y-h-r,.7*r,0,2*Math.PI);
  ctx.fill('evenodd');
  return [x,y-h-r];
}

const rkPose=(e,last)=>e<2.5?'qiyam':e<3.7?'ruku':e<4.7?'qiyam':e<6?'sujud':e<7?'duduk':e<8.3?'sujud':last?'duduk':'qiyam';

function adhanDur(name){

function lockDur(t0,name,active){
  if(DLOCK[t0]!==undefined)return DLOCK[t0];

function applyPray(a,ps,el){

/* ---------- jadwal agen (ditentukan oleh jam dinding) ---------- */
const BL=600,SPEED=1.5;
let schedCache={};
function chooseDest(r){const x=r();return x<.5?'cooler':x<.75?'printer':'board';}
function mkWalk(from,to,t0){
  const names=route(from,to),pts=[NODES[from]].concat(names.map(n=>NODES[n])),cum=[0];
  for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  return {k:'walk',t0,t1:t0+cum[cum.length-1]/SPEED,pts,cum,dest:to};
}
function mkM(pts,t0,dest){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return {k:'walk',room:'meet',t0,t1:t0+cum[cum.length-1]/SPEED,pts,cum,dest};}
function sched(a,b){
  const key=a.id+':'+b;
  if(schedCache[key])return schedCache[key];
  if(Object.keys(schedCache).length>240)schedCache={};
  const r=mb(hs(key)),seat='s'+a.desk,segs=[];let t=0;
  const work=(d,E)=>{const t1=Math.min(E,t+d);segs.push({k:'work',t0:t,t1,act:pickR(a.work,r)});t=t1;};
  const fill=(E,w0)=>{
    work(w0,E);
    while(t<E-150){
      const dest=chooseDest(r),w1=mkWalk(seat,dest,t),idle=4+r()*5,w2=mkWalk(dest,seat,w1.t1+idle);
      if(w2.t1+30>E)break;
      segs.push(w1,{k:'idle',t0:w1.t1,t1:w1.t1+idle,dest,act:SPOT[dest]},w2);t=w2.t1;
      work(40+r()*100,E);
    }
    if(t<E)work(E-t,E);
  };
  const mp=meetPlan(b);
  if(mp&&mp.ids.includes(a.id)){
    const ms=MSEAT[a.id],mid=ms[1]<14?[[5.3,11.8],[ms[0],11.8]]:[[5.3,11.8],[8.4,11.8],[8.4,17.2],[ms[0],17.2]],
      go=[NODES[seat]].concat(route(seat,'gate').map(q=>NODES[q]),mid,[ms]),
      ws=Math.max(10,mp.t0-mkM(go,0,'meet').t1);
    fill(ws,10+r()*70);
    const w1=mkM(go,t,'meet'),m1=Math.max(mp.t1,w1.t1+5),w3=mkM(go.slice().reverse(),m1,'out');
    segs.push(w1,{k:'meet',t0:w1.t1,t1:m1,act:'Rapat: '+mp.topic},w3);t=w3.t1;
    fill(BL,5+r()*20);
  }else fill(BL,10+r()*70);
  schedCache[key]=segs;return segs;
}
function applySched(a,nowMs){
  const ps=prayerAt(nowMs);
  if(ps){applyPray(a,ps,(nowMs-ps.t0)/1000);return;}
  a.pose=null;a.garb=null;a.back=false;a.wud=-1;a.pr=false;
  const s=nowMs/1000,b=Math.floor(s/BL),off=s-b*BL,segs=sched(a,b);
  let g=segs[segs.length-1];
  for(const x of segs){if(off<x.t1){g=x;break;}}
  a.loc='work';
  if(g.k==='walk'){
    const total=g.cum[g.cum.length-1],d=Math.max(0,Math.min(total,(off-g.t0)*SPEED));
    let i=1;while(i<g.cum.length-1&&g.cum[i]<d)i++;
    const p0=g.pts[i-1],p1=g.pts[i],L=(g.cum[i]-g.cum[i-1])||1,f=(d-g.cum[i-1])/L;
    a.x=p0[0]+(p1[0]-p0[0])*f;a.y=p0[1]+(p1[1]-p0[1])*f;a.state='walk';a.dest=g.dest;a.loc=g.room||'work';
  }else if(g.k==='idle'){
    const p=NODES[g.dest];a.x=p[0];a.y=p[1];a.state='idle';a.dest=g.dest;a.act=g.act;
  }else if(g.k==='meet'){
    const p=MSEAT[a.id];a.x=p[0];a.y=p[1];a.state='meet';a.dest=null;a.act=g.act;a.loc='meet';
  }else{
    const p=SEATS[a.desk];a.x=p[0];a.y=p[1];a.state='work';a.dest=null;a.act=g.act;
  }
  a.loc=a.y>10.05?'meet':'work';
  a.auto=null;
  if(a.state==='idle')a.auto={text:a.act};
  else if(a.state==='work'){const win=Math.floor(s/9);if(hs(a.id+win)%3===0&&s-win*9<3.5)a.auto={text:a.act};}
  else if(a.state==='meet'){const w=Math.floor(s/7);if(hs(a.id+'m'+w)%2===0&&s-w*7<3.5)a.auto={text:MLN[hs(a.id+w)%MLN.length]};}
}
function update(dt){
  const now=Date.now();
  AG.forEach(a=>{
    applySched(a,now);
    if(a.bubble){a.bubble.ttl-=dt;if(a.bubble.ttl<=0)a.bubble=null;}
  });
}

let adhan=null,adhanTimer=0,adhanPend=0;
const VOW=[[800,1250],[360,780],[320,2200]];
const AK=[[10,2,0],[12,1,0],[10,1,0],[8,.8,1],[7,.8,1],[10,1.8,0],[8,.6,1],[7,2.6,1]];
const SH2=[[7,.8,2],[8,.8,0],[10,1.2,0],[12,.8,1],[10,.8,0],[8,1,2],[7,1,0],[5,2,1]];
const MU2=[[8,1,0],[10,1,0],[12,1.5,0],[13.5,1,0],[12,1,1],[10,1.2,2],[8,2.6,0]];
const HY=[[10,1,2],[12,1,0],[13.5,2.6,0],[12,1,0],[10,1.2,1],[8,2.2,0]];
const FL2=[[10,1,2],[12,1,0],[13.5,1.2,0],[15,2.6,0],[13.5,1,0],[12,1.2,0],[10,2.4,2]];
const SL2=[[10,1.2,0],[12,1,0],[13.5,1.4,0],[12,1,1],[10,1,0],[8,1.2,2],[7,2.4,0]];
const LA2=[[8,1,1],[10,1,0],[8,.8,2],[7,1.2,1],[5,3.4,1]];
function adhanScore(subuh){
  const s=[AK,AK,AK,AK,SH2,SH2,MU2,MU2,HY,HY,FL2,FL2];
  if(subuh)s.push(SL2,SL2);
  s.push(AK,AK,LA2);
  return s;
}
function synthDur(subuh){let t=.3;adhanScore(subuh).forEach(ph=>{ph.forEach(n=>{t+=n[1]*.52;});t+=.6*.52;});return t;}
function stopAdhanAudio(){
  if(!adhan)return;
  try{
    if(adhan.el){adhan.el.pause();adhan.el.currentTime=0;}
    else{const n=AC.currentTime;adhan.master.gain.cancelScheduledValues(n);adhan.master.gain.setTargetAtTime(0,n,.15);adhan.oscs.forEach(o=>{try{o.stop(n+.8);}catch(e){}});}
  }catch(e){}
  adhan=null;
}
function stopAdhan(){stopAdhanAudio();adhanOn=false;clearTimeout(adhanTimer);}
function startAdhan(subuh){
  stopAdhan();adhanOn=true;
  let secs=(ADHAN_URL&&isFinite(adAudio.duration)&&adAudio.duration>0)?adAudio.duration:synthDur(subuh);
  if(muted||vol<=0||!touched){adhanTimer=setTimeout(()=>{adhanOn=false;},secs*1000);return;}
  try{
    if(ADHAN_URL){
      adAudio.muted=false;adAudio.currentTime=0;adAudio.volume=vol;adhan={el:adAudio};
      adAudio.play().catch(err=>{adhanOn=false;addMsg(boss,'Adzan gagal diputar ('+((err&&err.name)||'error')+'). Klik layar lalu coba lagi.','hint');});
      return;
    }
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const n=AC.currentTime+.3,BT=.52;
    const master=AC.createGain();master.gain.value=.7*vol;
    const conv=AC.createConvolver(),len=Math.floor(AC.sampleRate*2.6),buf=AC.createBuffer(2,len,AC.sampleRate);
    for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);}
    conv.buffer=buf;
    const dry=AC.createGain(),wet=AC.createGain();dry.gain.value=.75;wet.gain.value=.5;
    const env=AC.createGain();env.gain.value=0;
    const f1=AC.createBiquadFilter(),f2=AC.createBiquadFilter();
    f1.type='bandpass';f2.type='bandpass';f1.Q.value=5;f2.Q.value=5;
    const g1=AC.createGain(),g2=AC.createGain();g1.gain.value=1;g2.gain.value=.7;
    const o1=AC.createOscillator(),o2=AC.createOscillator(),lfo=AC.createOscillator(),lg=AC.createGain();
    o1.type='sawtooth';o2.type='sawtooth';o1.detune.value=-7;o2.detune.value=9;
    lfo.frequency.value=5.4;lg.gain.value=4.5;lfo.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);
    const mix=AC.createGain();o1.connect(mix);o2.connect(mix);
    mix.connect(f1);mix.connect(f2);f1.connect(g1);f2.connect(g2);g1.connect(env);g2.connect(env);
    env.connect(dry);env.connect(conv);conv.connect(wet);dry.connect(master);wet.connect(master);master.connect(AC.destination);
    const fq=s=>233*Math.pow(2,s/12);
    let t=n,prev=null;
    adhanScore(subuh).forEach(ph=>{
      env.gain.setTargetAtTime(1,t,.05);
      ph.forEach(([s,b,v],i)=>{
        const f=fq(s);
        if(prev===null){o1.frequency.setValueAtTime(f,t);o2.frequency.setValueAtTime(f,t);}
        else[o1,o2].forEach(o=>{o.frequency.setValueAtTime(prev,t);o.frequency.exponentialRampToValueAtTime(f,t+.14);});
        f1.frequency.setTargetAtTime(VOW[v][0],t,.05);f2.frequency.setTargetAtTime(VOW[v][1],t,.05);
        if(i>0)env.gain.setTargetAtTime(i%2?.82:1,t,.06);

      env.gain.setTargetAtTime(0,t-.1,.1);

    });

    [o1,o2,lfo].forEach(o=>{o.start(n);o.stop(end);});

function syncPhase(){const p=curPhase();if(p.label!==lastLabel){lastLabel=p.label;$('#plabel').textContent=p.label;$('#pdot').style.background=p.dot;}}

/* ---------- roster & tooltip ---------- */
const roster=$('#roster');
AG.forEach(a=>{const c=document.createElement('span');c.className='rc';c.id='rc-'+a.id;c.innerHTML='<i></i><b></b><em></em>';c.querySelector('i').style.background=a.color;c.querySelector('b').textContent=a.name;roster.append(c);});
function actText(a){return a.state==='walk'&&!a.pr?'Berjalan ke '+({cooler:'pantry',printer:'printer',board:'papan tugas',door:'ruang rapat',meet:'ruang rapat',out:'meja'}[a.dest]||'meja'):a.act;}
function syncRoster(){AG.forEach(a=>{$('#rc-'+a.id+' em').textContent=actText(a);});}
const tip=$('#tip');let tipFor=null;function syncRooms(){
  const n=AG.filter(a=>a.loc==='meet').length,now=Date.now()/1000;let txt='';
  if(n)txt=n+' ORANG';
  else for(let b=Math.floor(now/BL);b<=Math.floor(now/BL)+2;b++){const m=meetPlan(b);if(m&&b*BL+m.t0>now){const d=Math.round(b*BL+m.t0-now);txt='MULAI '+String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0');break;}}
  meetTxt=txt;
}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  let hit=null,best=1e9;
  AG.forEach(a=>{const cx=a._sx,cy=a._sy+8*AQ(),d=Math.hypot(x-cx,(y-cy)*.8);if(d<Math.max(24,26*S+8)&&d<best){best=d;hit=a;}});
  tipFor=hit&&tipFor!==hit?hit:null;
  if(!tipFor)tip.hidden=true;
});
function syncTip(){
  if(!tipFor)return;
  tip.hidden=false;
  tip.innerHTML='';
  const b=document.createElement('b');b.textContent=tipFor.name;b.style.color=tipFor.color;
  const s1=document.createElement('span');s1.textContent=tipFor.role+' · '+actText(tipFor);
  tip.append(b,s1);
  const w=tip.offsetWidth;
  tip.style.left=Math.max(6,Math.min(CW-w-6,tipFor._sx-w/2))+'px';
  tip.style.top=Math.max(6,tipFor._sy-70)+'px';
}

/* ---------- aliran kejadian (ditentukan oleh jam dinding) ---------- */
const CHAT={
 claude:['Commit baru sudah masuk ke main.','Tes unit lulus semua.','Lagi merapikan modul autentikasi.','Ada warning lint, saya benahi dulu.'],
 nova:['Palet warna baru siap dilihat.','Ukuran ikon tombol sudah saya samakan.','Mockup halaman login selesai.','Spasi di kartu harga saya rapikan.'],
 bolt:['Menemukan satu bug di form pendaftaran.','Regresi sudah dicek, aman.','Build staging hijau.','Kasus uji untuk login sudah ditambah.']
};
const CSLOT=40000;
function eventsBetween(t0,t1){
  const ev=[];
  for(let k=Math.floor(t0/CSLOT);k<=Math.floor(t1/CSLOT);k++){
    const r=mb(hs('chat:'+k));
    if(r()<.5){const who=AIS[Math.floor(r()*AIS.length)],t=k*CSLOT+r()*CSLOT;ev.push({t,who,text:pickR(CHAT[who.id],r)});}
  }
  tasksBetween(t0,t1).forEach(k=>{
    const w=byId(k.owner);
    if(k.pickAt>t0&&k.pickAt<=t1)ev.push({t:k.pickAt,who:w,text:`Mengambil tugas: ${k.text}.`});
    if(k.doneAt>t0&&k.doneAt<=t1)ev.push({t:k.doneAt,who:w,text:`Selesai: ${k.text}.`});
  });
  for(let b=Math.floor(t0/1000/BL);b<=Math.floor(t1/1000/BL);b++){const m=meetPlan(b);if(!m)continue;const w=byId(m.ids[0]);
    ev.push({t:(b*BL+m.t0)*1000,who:w,sys:1,text:`Rapat dimulai: ${m.topic} (${m.ids.map(i=>byId(i).name).join(', ')})`});
    ev.push({t:(b*BL+m.t1)*1000,who:w,sys:1,text:`Rapat selesai: ${m.topic}`});}
  return ev.filter(e=>e.t>t0&&e.t<=t1).sort((p,q)=>p.t-q.t);
}
function clockInTime(a){const d=new Date();d.setHours(0,0,0,0);const ds=d.getTime();return ds+(6.5*3600+hs(a.id+ds)%5400)*1000;}
let lastT=Date.now(),iqSent=0;
setInterval(()=>{
  const now=Date.now();
  refreshTasks(now);
  AG.forEach(a=>{const c=clockInTime(a);if(c>lastT&&c<=now)addMsg(a,'clocked in','sys',c);});
  if(ai){
    let evs=eventsBetween(lastT,now);
    if(evs.length>15)evs=evs.slice(-15);
    evs.forEach(e=>e.sys?addMsg(e.who,e.text,'sys',e.t):speak(e.who,e.text,e.t,false));
  }
  {const ps=prayerAt(now),pp=prayerAt(lastT);
   if(ps&&(now-ps.t0)/1000>=ps.plan.IQ&&iqSent!==ps.t0){iqSent=ps.t0;addMsg(boss,'Adzan selesai. Iqamah dikumandangkan, merapikan shaf.','sys',now);}
   if(ps&&(!pp||pp.t0!==ps.t0)){addMsg(boss,'Adzan '+ps.name+' berkumandang. Waktunya sholat berjamaah di masjid.','sys',now);startAdhan(ps.name==='Subuh');if(!touched&&!muted){adhanPend=ps.t0;addMsg(boss,'Klik atau ketuk layar sekali agar suara adzan bisa diputar.','hint',now);}}
   if(pp&&(!ps||ps.t0!==pp.t0)){addMsg(boss,'Sholat '+pp.name+' selesai. Kembali bekerja.','sys',now);stopAdhan();}}
  lastT=now;
},1000);
let di=0;$('#sholat').addEventListener('click',()=>{const q=PT[di++%PT.length];demo={t0:Date.now(),name:q[0],rk:q[3]};});

/* ---------- ukuran & loop ---------- */
let Z=1.25,PX=0,PY=0,S0=1,LW=0,LH=0;
function resize(){
  const r=stage.getBoundingClientRect();
  CW=Math.max(200,r.width);CH=Math.max(200,r.height);DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
  LW=CW-24;LH=CH-40-8-8;
  S0=Math.min(LW/1344,LH/804);
  layout();
}
function layout(){
  const lim=(full,view)=>full>view?(full-view)/2+40:0;
  S=S0*Z;
  PX=Math.max(-lim(1344*S,LW),Math.min(lim(1344*S,LW),PX));
  PY=Math.max(-lim(804*S,LH),Math.min(lim(804*S,LH),PY));
  OX=12+LW/2-32*S+PX;OY=8+LH/2-252*S+PY;
  $('#zfit').textContent=Math.round(Z*100)+'%';
}
function setZoom(z,mx,my){
  z=Math.max(.8,Math.min(2.6,z));
  if(mx===undefined){mx=CW/2;my=CH/2;}
  const wx=(mx-OX)/S,wy=(my-OY)/S;
  Z=z;S=S0*Z;
  PX=mx-wx*S-(12+LW/2-32*S);PY=my-wy*S-(8+LH/2-252*S);
  layout();
}
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();setZoom(Z*(e.deltaY<0?1.1:1/1.1),e.clientX-r.left,e.clientY-r.top);},{passive:false});
$('#zin').addEventListener('click',()=>setZoom(Z*1.2));
$('#zout').addEventListener('click',()=>setZoom(Z/1.2));
$('#zfit').addEventListener('click',()=>{Z=1.25;PX=PY=0;layout();});
{let dr=null;
 cv.addEventListener('pointerdown',e=>{dr={x:e.clientX,y:e.clientY,m:false};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
 cv.addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;if(!dr.m&&Math.hypot(dx,dy)<5)return;dr.m=true;cv.style.cursor='grabbing';PX+=dx;PY+=dy;dr.x=e.clientX;dr.y=e.clientY;layout();});
 const end=()=>{dr=null;cv.style.cursor='';};
 cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
}
new ResizeObserver(resize).observe(stage);resize();

let last=performance.now(),acc=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;
  update(dt);
  render(ts/1000);
  acc+=dt;if(acc>.4){acc=0;syncRoster();syncPhase();syncRooms();}
  syncTip();
  requestAnimationFrame(frame);
}
syncPhase();syncRoster();

/* isi awal: kejadian beberapa menit terakhir, sesuai jam sebenarnya */
$('#online').textContent=String(AG.length);
(function init(){
  const now=Date.now(),items=[];
  AG.forEach(a=>{const t=clockInTime(a);if(t<=now)items.push({t,a,text:'clocked in',sys:'sys'});});
  eventsBetween(now-12*60000,now).forEach(e=>items.push({t:e.t,a:e.who,text:e.text,sys:e.sys?'sys':''}));
  log.filter(e=>now-e.t<45*60000&&byId(e.id)).forEach(e=>items.push({t:e.t,a:byId(e.id),text:e.text,sys:e.sys}));
  items.sort((p,q)=>p.t-q.t).forEach(i=>addMsg(i.a,i.text,i.sys,i.t,false));
  addMsg(boss,'Ketik /help untuk melihat perintah. Klik karakter di kantor untuk melihat kegiatannya.','hint',now);
  refreshTasks(now);
})();
requestAnimationFrame(frame);
})();
</script>
