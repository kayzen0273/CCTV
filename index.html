<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Input & Edit Data</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }

        .paste-area {
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: monospace;
            resize: vertical;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover { background-color: #0056b3; }
        button.btn-success { background-color: #28a745; }
        button.btn-success:hover { background-color: #218838; }
        button.btn-danger { background-color: #dc3545; }
        button.btn-danger:hover { background-color: #c82333; }
        button.btn-secondary { background-color: #6c757d; }
        button.btn-secondary:hover { background-color: #5a6268; }

        .table-wrapper {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
            position: sticky;
            top: 0;
            color: #333;
            z-index: 1;
        }

        /* Input di dalam tabel agar bisa di-edit langsung */
        td input {
            width: 90%;
            padding: 6px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        td input:focus {
            border-color: #007bff;
            outline: none;
            background-color: #eef6ff;
        }

        .btn-delete {
            background-color: #dc3545;
            padding: 4px 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Input & Edit Data Tabel</h2>

    <!-- Area Paste -->
    <div class="paste-area">
        <label for="pasteInput"><strong>Tempel (Paste) Data Mentah di Sini:</strong></label>
        <textarea id="pasteInput" placeholder="Contoh format:&#10;00.00 S&#10;00.05 B&#10;00.10 S"></textarea>
        <div style="margin-top: 5px;">
            <button class="btn-success" onclick="prosesPasteData()">📥 Masukkan Data ke Tabel</button>
        </div>
    </div>

    <!-- Tombol Aksi Tabel -->
    <div class="action-buttons">
        <button onclick="tambahBaris()">➕ Tambah Baris Kosong</button>
        <button class="btn-secondary" onclick="salinSemuaData()">📋 Salin Data Tabel</button>
        <button class="btn-danger" onclick="kosongkanTabel()">🗑️ Hapus Semua</button>
    </div>

    <!-- Container Tabel -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 10%;">No</th>
                    <th style="width: 40%;">Jam / Waktu</th>
                    <th style="width: 35%;">Status</th>
                    <th style="width: 15%;">Aksi</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Tabel Kosong Secara Default -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Fungsi Menambah Baris Baru
    function tambahBaris(jam = '', status = '') {
        const tbody = document.getElementById('tableBody');
        const rowCount = tbody.rows.length + 1;

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="row-number">${rowCount}</td>
            <td><input type="text" value="${jam}" placeholder="00.00"></td>
            <td><input type="text" value="${status}" placeholder="S / B"></td>
            <td><button class="btn-delete" onclick="hapusBaris(this)">X</button></td>
        `;

        tbody.appendChild(tr);
        perbaruiNomor();
    }

    // Fungsi Mengisi Tabel dari Data Tempelan (Paste)
    function prosesPasteData() {
        const rawText = document.getElementById('pasteInput').value.trim();
        if (!rawText) {
            alert('Area teks paste masih kosong!');
            return;
        }

        const lines = rawText.split('\n');
        lines.forEach(line => {
            const cleanLine = line.trim();
            if (cleanLine) {
                const parts = cleanLine.split(/\s+/); // Memisah berdasarkan spasi/tab
                const jam = parts[0] || '';
                const status = parts[1] || '';
                tambahBaris(jam, status);
            }
        });

        // Kosongkan kotak teks setelah dimasukkan ke tabel
        document.getElementById('pasteInput').value = '';
    }

    // Fungsi Hapus Baris Tertentu
    function hapusBaris(button) {
        const row = button.closest('tr');
        row.remove();
        perbaruiNomor();
    }

    // Fungsi Reset / Kosongkan Seluruh Tabel
    function kosongkanTabel() {
        if (confirm('Yakin ingin menghapus seluruh isi tabel?')) {
            document.getElementById('tableBody').innerHTML = '';
        }
    }

    // Fungsi Memperbarui Urutan Nomor Tabel
    function perbaruiNomor() {
        const rows = document.querySelectorAll('#tableBody tr');
        rows.forEach((row, index) => {
            row.querySelector('.row-number').textContent = index + 1;
        });
    }

    // Fungsi Menyalin Semua Data di Tabel saat Ini
    function salinSemuaData() {
        const rows = document.querySelectorAll('#tableBody tr');
        if (rows.length === 0) {
            alert('Tabel masih kosong!');
            return;
        }

        let resultText = '';
        rows.forEach(row => {
            const inputs = row.querySelectorAll('input');
            const jam = inputs[0].value.trim();
            const status = inputs[1].value.trim();
            if (jam || status) {
                resultText += `${jam} ${status}\n`;
            }
        });

        navigator.clipboard.writeText(resultText.trim()).then(() => {
            alert('Data tabel berhasil disalin ke clipboard!');
        }).catch(err => {
            alert('Gagal menyalin data: ' + err);
        });
    }
</script>

</body>
</html>
